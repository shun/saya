[package]
name = "saya"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
readme = "README.md"

[[bin]]
name = "sy"
path = "src/main.rs"

[dependencies]
vim-core-rs = { path = "../../../vim-core-rs" }
tokio = { version = "1", features = ["rt", "sync", "macros", "time", "rt-multi-thread"] }
ratatui = "0.29.0"
crossterm = { version = "0.28.1", features = ["event-stream"] }
futures = "0.3"
log = "0.4.29"
unicode-width = "0.2.0"
deno_core = "0.390.0"
deno_error = "0.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
